name: Build framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    name: Portable logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure tests
        run: cmake -S . -B build/tests -DDREAMS_TESTS_ONLY=ON
      - name: Build tests
        run: cmake --build build/tests
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  native:
    name: Windows x64 DLL
    needs: logic
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64 DLL
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "The Windows runner did not provide VCPKG_INSTALLATION_ROOT."
          }
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build DLL
        run: cmake --build build/windows --config Release --parallel 2
      - name: Stage DLL
        run: cmake --install build/windows --config Release --prefix build/package
      - name: Upload DLL (not a complete mod)
        uses: actions/upload-artifact@v4
        with:
          name: native-dll-only-not-a-complete-mod
          path: build/package/F4SE/Plugins/TheSoleSurvivorDreams.dll
          if-no-files-found: error
          retention-days: 14
